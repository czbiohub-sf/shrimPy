[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "napari-deskew-preview"
description = "napari widget for quick on-demand deskew preview of oblique-plane light-sheet data (czbiohub-sf internal)"
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# No module here imports napari -- it is discovered *by* napari through the
# napari.manifest entry point below, and the deskew core is plain numpy. Keeping
# napari optional lets the numpy-only core (and its tests) be installed without
# pulling a GUI stack; `pip install napari-deskew-preview[napari]` if you want
# napari itself pulled in too.
dependencies = [
  "numpy",
  "qtpy",
]
classifiers = [
  "Framework :: napari",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
napari = ["napari"]
dev = ["pytest", "ruff"]

[project.entry-points."napari.manifest"]
napari-deskew-preview = "napari_deskew_preview:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/napari_deskew_preview"]

[tool.ruff]
line-length = 95
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B"]
ignore = ["E501", "N802", "N815"]
