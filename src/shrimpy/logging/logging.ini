[loggers]
keys=root,shrimpy,copylot

[handlers]
keys=console,file

[formatters]
keys=console,file

# ------------------
# FORMATTERS
# ------------------

[formatter_console]
format=%(asctime)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_file]
format=%(asctime)s - %(levelname)s - %(name)s.%(module)s.%(funcName)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

# ------------------
# HANDLERS
# ------------------

[handler_console]
class=StreamHandler
level=INFO
formatter=console
args=(sys.stdout,)

[handler_file]
class=FileHandler
level=DEBUG
formatter=file
args=('%(log_file)s', 'a', 'utf-8')

# ------------------
# LOGGERS
# ------------------

[logger_root]
level=WARNING
handlers=

[logger_shrimpy]
level=DEBUG
handlers=console,file
qualname=shrimpy
propagate=0

# Vendored coPylot (packages/copylot: Vortran lasers, photom) logs under
# "copylot"; route it to the same console and acquisition log file.
[logger_copylot]
level=DEBUG
handlers=console,file
qualname=copylot
propagate=0
