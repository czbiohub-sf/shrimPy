[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "shrimpy"
description = "Custom acquisition engines for optical microscopes based on pymmcore-plus"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12, <4.0"

# the dynamically determined project metadata attributes
dynamic = ["version"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]

# list package dependencies here
dependencies = [
  "click",
  "numpy",
  "ome-writers[acquire-zarr]",
  # TODO: test v0.7.0, even simple acquisitions would fail
  "acquire-zarr==0.6.0",
  "pymmcore>=11.14.0.75.0",
  "pymmcore-gui",
  "pymmcore-plus",
  "pymmcore-widgets",
  "PyYAML",
  "qtpy",
  "useq-schema",
]


[project.optional-dependencies]
build = ["build", "twine"]

[dependency-groups]
dev = [
  "pre-commit~=4.5",
  "pytest~=9.0",
  "ruff~=0.15",
  "iohub",
  "ipykernel",
]
dynatrack = [
  "biahub[stain]",  # [stain] pulls in cytoland, required for dynatrack
  "matplotlib",
  "torch",
]
# CI-only: the CPU torch build is all the DynaTrack *unit* tests need (they
# exercise pure torch/numpy math, not biahub/cytoland). Avoids the ~2.5 GB
# CUDA wheel the `dynatrack` group pulls on Windows.
test-cpu = ["torch"]
# Smart FOV-selection stack (shrimpy/fov_selection/*). Opt-in: install with
# `uv sync --group fov` (not in default-groups, so a plain `uv sync` stays lean).
fov = [
  "cellpose",        # CellposeDINO "cpdino" + Cellpose-SAM "cpsam" segmentation
  "dinov3",          # DINOv3 ViT backbone required by cellpose's "cpdino" model (GitHub-only)
  "stardist",        # StarDist nuclei segmentation baseline (uses TensorFlow)
  "tensorflow-cpu",  # StarDist backend; CPU build avoids GPU contention with torch
  "instanseg-torch", # InstanSeg nuclei/cell segmentation (torch-native)
  "imageio",         # 8-bit PNG export
  "napari[pyqt6]",   # interactive viewing (PyQt6: matches pymmcore-gui's binding)
  "napari-iohub",    # OME-Zarr / HCS reader plugin for napari
  # analysis stack used by the pipeline / feature viewer / goodness prediction
  "scikit-learn",    # decision-tree model + PCA/t-SNE in the feature viewer
  "scikit-image",    # regionprops object features in extract_fov_features
  "scipy",           # nearest-neighbor / spatial stats in feature extraction
  "pandas",          # feature-matrix tables throughout
  "matplotlib",      # figures (predict_fov_goodness, viewer)
  "joblib",          # save/load the trained tree model
  # reconstruction for the FOV pre-scan (deskew -> phase -> virtual staining).
  # Pull the whole `dynatrack` group so a fov venv can run preprocessing too;
  # this brings in biahub[stain] (waveorder/cytoland/jsonargparse) + torch,
  # so torch also picks up the group="dynatrack" cu132 index on Windows.
  { include-group = "dynatrack" },
]

[project.scripts]
shrimpy = "shrimpy.cli.main:cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["shrimpy"]

[tool.uv.sources]
pymmcore-plus = { git = "https://github.com/ieivanov/pymmcore-plus", branch = "dev" }
ome-writers = { git = "https://github.com/ieivanov/ome-writers", branch = "add-plate-row-col" }
useq-schema = { git = "https://github.com/ieivanov/useq-schema", branch = "add-plate-row-col" }
# Windows: CUDA build via cu132 index (requires CUDA Toolkit 13.2 on the machine)
# for the production `dynatrack` group; the CI-only `test-cpu` group takes the
# CPU wheel instead. Elsewhere (macOS/Linux) both fall back to PyPI (CPU/MPS).
torch = [
  { index = "pytorch-cu132", group = "dynatrack", marker = "sys_platform == 'win32'" },
  # `fov` include-groups `dynatrack`, but uv scopes this index to the group that
  # DIRECTLY requires torch, not to include-group ancestors -- so `fov` needs its
  # own entry or `uv sync --group fov` silently falls back to the PyPI CPU wheel.
  { index = "pytorch-cu132", group = "fov", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", group = "test-cpu", marker = "sys_platform == 'win32'" },
]

# no pipy release
pymmcore-gui = { git = "https://github.com/pymmcore-plus/pymmcore-gui", branch = "main" }

# needed for phase reconstruction, deskew, and virtual staining
biahub = { git = "https://github.com/czbiohub-sf/biahub", rev = "b011bca57d5bf15c777839e4250e594f7471af3e"}

# no pipy release yet; uv sources don't propagate, so mirror biahub's cytoland pin
cytoland = { git = "https://github.com/mehta-lab/VisCy", subdirectory = "applications/cytoland", rev = "4b62365c0df25929bffc7f01b3bb2d1c11d69cce" }

# GitHub-only deps for the `fov` group (not on PyPI).
napari-iohub = { git = "https://github.com/czbiohub-sf/napari-iohub.git" }
dinov3 = { git = "https://github.com/facebookresearch/dinov3" }  # cellpose "cpdino" backbone

# torch's CUDA and CPU builds can't coexist; pick exactly one group.
[tool.uv]
conflicts = [[{ group = "dynatrack" }, { group = "test-cpu" }]]

[[tool.uv.index]]
# TODO: upda CUDA toolkit on mantis microscope
# https://developer.nvidia.com/cuda-13-2-1-download-archive?target_os=Windows&target_arch=x86_64&target_version=11&target_type=exe_network
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
# Ruff replaces black, isort, flake8, and pylint
line-length = 95
target-version = "py312"

# Exclude non-package code
exclude = ["archive", "examples", "scripts"]

[tool.ruff.lint]
# Enable rule sets:
# F = pyflakes
# E/W = pycodestyle errors/warnings
# I = isort
# N = pep8-naming
# UP = pyupgrade
# B = flake8-bugbear
select = ["F", "E", "W", "I", "N", "UP", "B"]

# Ignore rules to match current flake8 config (ignores C, R, W categories)
ignore = [
    "E501",  # Line too long (handled by formatter)
    "N802",  # Function name should be lowercase (Qt uses camelCase)
    "N815",  # Variable in class scope should not be mixedCase (Qt uses camelCase)
]

[tool.ruff.lint.isort]
# Match current isort settings
lines-between-types = 1
known-first-party = ["shrimpy"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["shrimpy/tests"]
# Never collect tests from archived/legacy code or scripts (any depth)
norecursedirs = ["archive", "scripts"]
