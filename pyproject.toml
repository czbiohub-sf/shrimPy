[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "shrimpy"
description = "Custom acquisition engines for optical microscopes based on pymmcore-plus"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12, <4.0"

# the dynamically determined project metadata attributes
dynamic = ["version"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]

# list package dependencies here
dependencies = [
  # arrives transitively via ome-writers, but declared directly to pin the floor
  "acquire-zarr>=0.9.0",
  "click",
  "numpy",
  "ome-writers[acquire-zarr]",
  "pymmcore>=11.14.0.75.0",
  "pymmcore-plus",
  "PyYAML",
  "qtpy",
  "useq-schema",
  # also transitive via ome-writers; declared so [tool.uv.sources] can redirect it
  "yaozarrs",
]


# Optional *runtime* features, opt-in by users of the installed package
# (`uv sync --extra gui`, `pip install "shrimpy[gui]"`).
[project.optional-dependencies]
# `shrimpy gui` only; nothing in the package imports Qt at module level, so the
# acquisition CLI and the engines run headless without this.
gui = ["pymmcore-gui"]
# iohub reads the acquisition's OME-Zarr back (shrimpy.viewer.store): it already
# handles every layout ome-writers writes, and is how the lab opens these stores
# elsewhere. Only the viewer needs it, so `shrimpy acquire` stays lean without it.
viewer = ["napari[pyqt6]", "napari-deskew-preview", "iohub"]
dynatrack = [
  "biahub[stain]",  # [stain] pulls in cytoland, required for dynatrack
  "matplotlib",
  "torch",
]

# Development and CI only: never published in the package metadata, so these
# cannot be installed by a consumer (`uv sync --group dev`).
[dependency-groups]
build = ["build", "twine"]
dev = [
  "pre-commit~=4.5",
  "pytest~=9.0",
  "ruff~=0.15",
  "iohub",
  "ipykernel",
  # Workspace member, so its (numpy-only) tests run in the default environment.
  # Costs nothing: its deps are numpy and qtpy, both already core.
  "napari-deskew-preview",
]
# CI-only: the CPU torch build is all the DynaTrack *unit* tests need (they
# exercise pure torch/numpy math, not biahub/cytoland). Avoids the ~2.5 GB
# CUDA wheel the `dynatrack` extra pulls on Windows.
test-cpu = ["torch"]

[project.scripts]
shrimpy = "shrimpy.cli.main:cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
# Only the package ships. Tests and archived implementations live at the repo root
# (tests/, archive/) precisely so they stay out of the wheel.
packages = ["src/shrimpy"]

# napari-deskew-preview is developed here but published as its own distribution,
# so it is a workspace member rather than part of the shrimpy package. It can be
# installed on its own:
#   pip install "napari-deskew-preview @ git+https://github.com/czbiohub-sf/shrimPy.git#subdirectory=packages/napari-deskew-preview"
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pymmcore-plus = { git = "https://github.com/ieivanov/pymmcore-plus", branch = "main" }
ome-writers = { git = "https://github.com/ieivanov/ome-writers", branch = "main" }
useq-schema = { git = "https://github.com/ieivanov/useq-schema", branch = "main" }
# Released yaozarrs (<=0.3.2) never writes the plate *row* groups from
# PlateBuilder.prepare(), the path ome-writers takes, so an HCS store cannot be read
# until it is closed and the live viewer stays empty for the whole acquisition.
# imaging-formats/yaozarrs#58; point this back at PyPI once that is released.
yaozarrs = { git = "https://github.com/ieivanov/yaozarrs", branch = "fix-plate-builder-row-groups" }
napari-deskew-preview = { workspace = true }
# Windows: CUDA build via cu132 index (requires CUDA Toolkit 13.2 on the machine)
# for the production `dynatrack` group; the CI-only `test-cpu` group takes the
# CPU wheel instead. Elsewhere (macOS/Linux) both fall back to PyPI (CPU/MPS).
torch = [
  { index = "pytorch-cu132", extra = "dynatrack", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", group = "test-cpu", marker = "sys_platform == 'win32'" },
]

# no pipy release
pymmcore-gui = { git = "https://github.com/pymmcore-plus/pymmcore-gui", branch = "main" }

# needed for phase reconstruction, deskew, and virtual staining
biahub = { git = "https://github.com/czbiohub-sf/biahub", rev = "b011bca57d5bf15c777839e4250e594f7471af3e"}

# no pipy release yet; uv sources don't propagate, so mirror biahub's cytoland pin
cytoland = { git = "https://github.com/mehta-lab/VisCy", subdirectory = "applications/cytoland", rev = "4b62365c0df25929bffc7f01b3bb2d1c11d69cce" }

# torch's CUDA and CPU builds can't coexist; pick exactly one of these.
[tool.uv]
conflicts = [[{ extra = "dynatrack" }, { group = "test-cpu" }]]

# pyqt6-qt6 moved its Linux baseline from manylinux_2_28 to manylinux_2_34 at
# 6.10.0, so 6.9.x is the newest build that runs on glibc 2.28 hosts (RHEL/Rocky
# 8, which includes the HPC dev machines). Scoped to Linux so the Windows
# acquisition machines stay on current Qt. Reaches PyQt6 wherever it enters the
# graph -- pymmcore-gui via [gui], napari[pyqt6] via [viewer].
#
# Must be an override, not a constraint: pymmcore-gui pins pyqt6==6.11.0, which
# a constraint cannot relax, and an override *replaces* every requirement on the
# package. That replacement is also why the second entry is needed -- with only
# the Linux one, pyqt6 is overridden into nothing off Linux and napari installs
# with no Qt bindings at all (`uv run napari` then fails on a missing PyQt6).
override-dependencies = [
  "pyqt6<6.10; sys_platform == 'linux'",
  "pyqt6>=6.10; sys_platform != 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
# Ruff replaces black, isort, flake8, and pylint
line-length = 95
target-version = "py312"

# Exclude non-package code
exclude = ["archive", "examples", "scripts"]

[tool.ruff.lint]
# Enable rule sets:
# F = pyflakes
# E/W = pycodestyle errors/warnings
# I = isort
# N = pep8-naming
# UP = pyupgrade
# B = flake8-bugbear
select = ["F", "E", "W", "I", "N", "UP", "B"]

# Ignore rules to match current flake8 config (ignores C, R, W categories)
ignore = [
    "E501",  # Line too long (handled by formatter)
    "N802",  # Function name should be lowercase (Qt uses camelCase)
    "N815",  # Variable in class scope should not be mixedCase (Qt uses camelCase)
]

[tool.ruff.lint.isort]
# Match current isort settings
lines-between-types = 1
known-first-party = ["shrimpy"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
# The workspace member's tests are numpy-only (no napari/Qt), so they run in the
# default environment alongside shrimPy's.
testpaths = ["tests", "packages/napari-deskew-preview/tests"]
# Never collect tests from archived/legacy code or scripts (any depth)
norecursedirs = ["archive", "scripts"]
