# MMConfig for ReplayCamera — replays pre-acquired OME-Zarr data
# Requires UniMMCore from pymmcore-plus experimental
#
# Usage:
#   from pymmcore_plus.experimental.unicore.core._unicore import UniMMCore
#   core = UniMMCore()
#   core.loadSystemConfiguration("MMConfig_demo_ReplayCamera.cfg")

# Reset
Property,Core,Initialize,0

# Devices
Device,DHub,DemoCamera,DHub
Device,Dichroic,DemoCamera,DWheel
Device,Emission,DemoCamera,DWheel
Device,Excitation,DemoCamera,DWheel
Device,Objective,DemoCamera,DObjective
Device,ObjectiveZ,DemoCamera,DStage
Device,PiezoZ,DemoCamera,DStage
Device,Path,DemoCamera,DLightPath
Device,XY,DemoCamera,DXYStage
Device,White Light Shutter,DemoCamera,DShutter
Device,Autofocus,DemoCamera,DAutoFocus
Device,LED,DemoCamera,DStateDevice
Device,LED Shutter,Utilities,State Device Shutter
#py pyDevice,Camera,shrimpy.replay_camera,ReplayCamera

# Pre-init settings for devices
Property,LED,Number of positions,10
# Update data path to point to desired dataset
#py Property,Camera,DataPath,/hpc/projects/comp.micro/microscope_dev/smart_fov_selection/input_data/2026_06_24_A549_H2BC21_FOV_selection_mantis/0-flatfield/2026_06_24_A549_H2BC21_FOV_selection_1.zarr

