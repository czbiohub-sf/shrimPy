# Group: Channel
# Each preset sets the ReplayCamera channel and the optical path
# Channel names MUST match the channel_names in the zarr dataset:
#   ['BF - Oblique', 'GFP EX488 EM525-45']

# Preset: BF - Oblique
ConfigGroup,Channel,BF - Oblique,Emission,Label,Chroma-HQ535
