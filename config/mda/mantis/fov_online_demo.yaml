# Online FOV-selection demo (M3): ONE streaming run.
#
#   timepoint 0  = pre-scan on `input_channel` over all `search_mda` candidates.
#                  As each FOV's z-stack completes, it is reconstructed
#                  (deskew -> phase -> virtual stain), projected, segmented, and
#                  scored by the trained tree -- streamed via frameReady in a
#                  worker subprocess (torch/GPU isolation, like DynaTrack).
#   timepoint >=1 = full timelapse, acquired ONLY on the FOVs predicted "good".
#
# Single run => one output store, one array shape per position, so the pre-scan
# z-range equals the timelapse z-range (a single-run constraint). The pre-scan
# consumes timepoint 0; set time_plan.loops = desired_timelapse_points + 1.
#
# Replays the A549 store (raw BF + GFP), matching the online scope.

# ---- TIMELAPSE parameters (run on the SELECTED positions) ----
# Main stage_positions is EMPTY: the candidate FOVs are defined in
# fov_selection.search_mda below (DynaTrack-style separation).
stage_positions: []

time_plan:
  prioritize_duration: true
  interval: 1
  loops: 2            # t0 = pre-scan, t1 = timelapse (raise for a longer timelapse)

z_plan:
  top: 79.95
  bottom: -80.1
  step: 0.15
  go_up: true

channels:
  - config: BF - Oblique
    group: Channel
    exposure: 1.0
  - config: GFP EX488 EM525-45
    group: Channel
    exposure: 1.0

# ---- FOV-SELECTION parameters ----
# Style follows config/mda/mantis/dynatrack_demo.yaml: deskew / phase /
# virtual_staining blocks live directly under fov_selection; the XY pixel size
# and Z step are NOT set here -- they are fetched from the Core
# (core.getPixelSizeUm()) and z_plan.step at runtime and injected into deskew /
# phase (single source of truth).
metadata:
  mantis:
    reset_hardware_sequencing_settings:
      - ['PiezoZ', 'UseSequences', 'No']
    autofocus:
      enabled: false
      method: demo-PFS
      stage: ObjectiveZ

    fov_selection:
      enabled: true

      # Acquired channel fed to reconstruction (the pre-scan channel).
      input_channel: "BF - Oblique"

      # Channels the decision is computed on (segmented + fed to the model).
      # May be raw input channels or preprocessed (VS) channels; here the
      # virtual-stained nuclei/membrane.
      fov_selection_channels: ['nuclei', 'membrane']

      # Ordered preprocessing steps. Reconstruction steps (deskew/phase/vs) are
      # consumed by the shared preprocessor; sum_projection/segmentation are
      # consumed by the FOV pipeline. Some algorithms (e.g. DynaCLR) would omit
      # 'segmentation'; the current tree model requires it.
      preprocessing: ['deskew', 'phase', 'vs', 'sum_projection', 'segmentation']

      deskew:
        ls_angle_deg: 30.0
        keep_overhang: false
        average_n_slices: 3

      phase:
        transfer_function:
          wavelength_illumination: 0.450
          z_padding: 5
          index_of_refraction_media: 1.4
          numerical_aperture_detection: 1.35
          numerical_aperture_illumination: 0.52
          invert_phase_contrast: false
        apply_inverse:
          reconstruction_algorithm: Tikhonov
          regularization_strength: 0.01

      virtual_staining:
        ckpt_path: /hpc/projects/organelle_phenotyping/models/VSCyto3D-A549-infection-finetune/4gpu_bf16_bs16_to_ep7/checkpoints/epoch=7-step=832.ckpt
        target_channels: ['nuclei', 'membrane']
        sliding_window_step: 1
        model:
          class_path: cytoland.engine.VSUNet
          init_args:
            architecture: fcmae
            model_config:
              in_channels: 1
              out_channels: 2
              in_stack_depth: 15
              encoder_blocks: [3, 3, 9, 3]
              dims: [96, 192, 384, 768]
              encoder_drop_path_rate: 0.1
              stem_kernel_size: [5, 4, 4]
              decoder_conv_blocks: 2
              pretraining: false
            test_time_augmentations: false
            tta_type: mean

      # Switchable segmentation. Only 'cellpose' is supported now; params fall
      # back to the batch script's training defaults when unset.
      segmentation:
        model: cellpose
        model_name: cpdino
        gpu: true
        flow_threshold: 0.4
        cellprob_threshold: 0.0
        batch_size: 64
        min_size: 15
        diameters:            # microns; null -> Cellpose auto-scale
          nuclei: null
          membrane: 120.0

      # Trained FOV-goodness model. Uses nuclei_vs_sum__coverage_frac +
      # membrane_vs_sum__objects_per_10um2.
      model:
        path: /hpc/projects/comp.micro/microscope_dev/smart_fov_selection/fov_selection_output/fov_features/split_analysis/max_accuracy/model_on_three_dataset/final_model_nuclei-vs_membrane-vs.joblib
        threshold: 0.5

      # Pre-scan MDA: defines which FOVs are searched, as a useq WellPlatePlan
      # (like config/mda/mantis/fov_selection_demo.yaml) so it scales -- pick
      # wells and a per-well FOV grid instead of listing paths. useq assigns
      # plate_row/plate_col + slash-free field names, so the output is a proper
      # HCS OME-Zarr (row/col/fov). Only stage_positions is used for acquisition
      # (pre-scan channel = input_channel; z = the main z_plan, per the
      # single-run constraint above).
      #
      # Here: wells B/3, B/4, B/5 with a 1x1 FOV grid (3 candidates). Offline,
      # the ReplayCamera maps each plate position to the matching source FOV
      # (well B/3 fov 0 -> source B/3/000000, etc.).
      search_mda:
        stage_positions:
          a1_center_xy: [0.0, 0.0]
          plate:
            rows: 4
            columns: 6
            name: 24-well
            well_size: [15.6, 15.6]
            well_spacing: [19.0, 19.0]
          selected_wells:
            - [1, 1, 1]     # rows: B, B, B
            - [2, 3, 4]     # columns: 3, 4, 5
          well_points_plan:
            rows: 1
            columns: 1
            fov_height: 180.0
            fov_width: 180.0
        channels:
          - config: BF - Oblique
            group: Channel
            exposure: 1.0
