# Online FOV-selection CALIBRATION demo (ReplayCamera).
#
# Runs the NEW FOV-selection pipeline (see config/mda/mantis/config.yaml) in
# CALIBRATION MODE against the ReplayCamera, so the whole path can be exercised
# offline without the scope:
#
#   PRE-SCAN ONLY.  With `calibration_mode: True` the engine runs just the pre-scan
#   over all candidate FOVs -- NO timelapse afterwards. For every FOV the BF z-stack
#   is reconstructed (flatfield -> deskew), projected, segmented, and EVERY available
#   feature is extracted (the model.features block is ignored for extraction in this
#   mode). The per-FOV feature matrix + projection/mask PNGs are written in the feature
#   viewer's standard layout under <name>_fov_debug/, and when the pre-scan finishes the
#   engine opens the feature viewer on that CSV.
#
#   The point: explore the features in the viewer, tune a score function / ranking
#   profile, Save... it to YAML, paste it into `model.features` below, flip
#   `calibration_mode: False`, and re-run for a standard (pre-scan + timelapse) run.
#
# ReplayCamera specifics preserved from the old demo: the pre-scan uses a WellPlatePlan
# whose pos_names (B3_0000, ...) map to the source HCS store (well B/3 fov k -> k-th
# source FOV in B/3), and the channel `config` names must match the store's channels
# (BF - Oblique, GFP EX488 EM525-45). Point the ReplayCamera at the A549 plate store.

# ---- Timelapse stage_positions (top-level) ----
# EMPTY: only used when calibration_mode is False, and then filled at runtime from the
# FOVs the pre-scan selects. Ignored in calibration mode (no timelapse is run).
stage_positions: []

time_plan:
  prioritize_duration: true
  interval: 1
  loops: 1            # number of TIMELAPSE timepoints (only used when calibration off)

z_plan:
  top: 79.95
  bottom: -80.1
  step: 0.15
  go_up: true

channels:
  - config: BF - Oblique
    group: Channel
    exposure: 1.0
  - config: GFP EX488 EM525-45
    group: Channel
    exposure: 1.0

metadata:
  mantis:
    reset_hardware_sequencing_settings:
      - ['PiezoZ', 'UseSequences', 'No']
    autofocus:
      enabled: false
      method: demo-PFS
      stage: ObjectiveZ

    fov_selection:
      enabled: true

      # Calibration mode: PRE-SCAN ONLY (no timelapse), extract EVERY feature (model.features
      # is ignored for extraction), then open the feature viewer on the pre-scan feature
      # matrix. save_decision is forced on; the CSV + PNG folders land under <name>_fov_debug/.
      # Set to False for a standard acquisition (pre-scan + timelapse on the selected FOVs).
      calibration_mode: True

      # ---- Pre-scan MDASequence ----
      # A complete, valid MDASequence run FIRST over all candidate FOVs. Its stage_positions
      # (a useq WellPlatePlan: select wells + a per-well FOV grid) are the candidates; useq
      # assigns plate_row/plate_col + slash-free field names, so the ReplayCamera can map each
      # plate position to the matching source FOV. Here: wells B/3, B/4, B/5 with a 7x7 grid
      # = 147 candidates (the full offline dataset). For a quick smoke test, set
      # well_points_plan rows/columns to 1 (1 FOV/well -> 3 candidates).
      #
      # Must be a single timepoint (validated); it images only `fov_selection_channel`. No
      # `setup` block here -- the ReplayCamera needs no hardware property setup.
      prescan_mda:
        stage_positions:
          a1_center_xy: [0.0, 0.0]
          plate:
            rows: 4
            columns: 6
            name: 24-well
            well_size: [15.6, 15.6]
            well_spacing: [19.0, 19.0]
          selected_wells:
            - [1]     # rows: B, B, B
            - [3]     # columns: 3, 4, 5
          well_points_plan:
            rows: 7           # 7x7 = 49 FOVs/well; B/3,B/4,B/5 -> 147 total
            columns: 7
            fov_height: 180.0
            fov_width: 180.0
        time_plan:
          loops: 1            # single pre-scan timepoint (validated)
          interval: 0
        z_plan:
          top: 79.95
          bottom: -80.1
          step: 0.15
          go_up: true
        channels:
          - config: BF - Oblique
            group: Channel
            exposure: 1.0

      # Acquired channel imaged during the pre-scan and fed to reconstruction (must be one
      # of prescan_mda.channels). The A549 store's brightfield channel.
      fov_selection_channel: "BF - Oblique"

      # Ordered preprocessing steps. The XY pixel size and Z step are NOT set here -- they
      # are fetched from the Core (core.getPixelSizeUm()) and z_plan.step at runtime and
      # injected into deskew (single source of truth).
      #
      # ---- ACTIVE (pipeline A): middle-slice brightfield + Cellpose-DINO -------------
      # Single reconstructed brightfield channel -> plain (unprefixed) feature names, which
      # is what the ranking model below reads. Needs a GPU + the cpdino weights.
      preprocessing: ['flatfield', 'deskew', 'middle_slice_projection', 'segmentation']
      # ---- ALTERNATIVE (pipeline B): log-std brightfield + Otsu ----------------------
      # No GPU / trained model -- the lightest path for a quick calibration test. Switch the
      # `segmentation:` block to the Otsu alternative below as well.
      # preprocessing: ['flatfield', 'deskew', 'logstd_projection', 'segmentation']

      deskew:
        ls_angle_deg: 30.0
        keep_overhang: false
        average_n_slices: 3

      # Switchable segmentation (`model`: cellpose | instanseg | otsu). Pick ONE block.
      # ---- ACTIVE (pipeline A): Cellpose-DINO ----------------------------------------
      segmentation:
        model: cellpose
        model_name: cpdino
        gpu: true
        flow_threshold: 0.4
        cellprob_threshold: 0.0
        batch_size: 64
        min_size: 15
        diameters:            # microns; null -> Cellpose auto-scale
          nuclei: null
          membrane: 120.0
      # ---- ALTERNATIVE (pipeline B): Otsu on the log-std projection ------------------
      # segmentation:
      #   model: otsu
      #   close_radius: 10     # morphological-closing disk radius in px (0 = skip)
      #   min_size: 8000       # remove foreground components smaller than this (px)
      #   fill_holes: true     # fill interior holes of the foreground

      # FOV-goodness model. In calibration mode this is NOT used to pick which features to
      # extract (all are extracted) and no selection is applied, but a valid model block is
      # still required. The ranking profile below is just a starting point -- replace it with
      # what you save from the feature viewer's Rank tab, then set calibration_mode: False.
      model:
        type: ranking_by_defined_range
        top_fov: 20                    # keep the 20 highest-ranked FOVs (used only when calibration off)
        features:
          coverage_frac:               # fraction of the FOV covered by objects (gaussian bell)
            shape: gaussian
            center: 0.68376
            fwhm: 0.17561
            weight: 1.0
          max_gap_um:                  # largest object-free region radius (um) (gaussian bell)
            shape: gaussian
            center: 21.96101
            fwhm: 7.81154
            weight: 1.0

      # Debug outputs. save_decision is forced on in calibration mode regardless of this flag.
      save_pre_scan_omezarr: False   # also write the per-step reconstruction to <name>_prescan.ome.zarr
      save_decision: True           # feature-matrix CSV + projection/mask PNGs under <name>_fov_debug/
