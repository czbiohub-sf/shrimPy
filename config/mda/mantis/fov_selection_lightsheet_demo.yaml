# Setup
setup:
  roi: [100, 1050, 1664, 256]
  channel:
    config: Right
    group: Imaging Path
  properties:
    - ['LS Position Galvo', 'Position', '0.116']
    - ['LS Angle Galvo', 'Position', '-0.24']
    - ['Prime BSI Express', 'ReadoutRate', '100MHz 16bit']
    - ['Prime BSI Express', 'Gain', '2-CMS']
    - ['Prime BSI Express', 'ExposeOutMode', 'Rolling Shutter']
    - ['TS2_TTL1-8', 'Sequence', 'Off']
    - ['TS2_TTL1-8', 'Blanking', 'On']
    - ['TS2_DAC03', 'Sequence', 'On']

# Define stage positions
stage_positions: []

# Define time plan
time_plan:
  prioritize_duration: true
  interval: 0  # DEBUG
  loops: 1

# Define z plan
z_plan:
  top: 70
  bottom: -90
  step: 0.15
  # step: 15  # DEBUG
  go_up: true

# Define channels
channels:
- config: BF
  group: Channels - Right
  exposure: 5.0
  do_stack: true
  z_offset: 0.0
  acquire_every: 1
  camera: null
  # 5 mW 488 laser power
- config: GFP EX488 EM525-45
  group: Channels - Right
  exposure: 10.0
  do_stack: true
  z_offset: 0.0
  acquire_every: 1
  camera: null

autofocus_plan: null
keep_shutter_open_across: []

# Define metadata per microscope
metadata:
  pymmcore_widgets:
    version: 0.10.2.dev23+g22b8c0aff.d20260106
  reset_hardware_sequencing_settings:
    - ['TS2_TTL1-8', 'Blanking', 'Off']
    - ['TS2_DAC03', 'Sequence', 'Off']
    - ['XYStage:XY:31', 'MotorSpeedX-S(mm/s)', '5.75']
    - ['XYStage:XY:31', 'MotorSpeedY-S(mm/s)', '5.75']
  autofocus:
    enabled: true
    method: PFS
    stage: ZDrive

  fov_selection:
    enabled: true
    calibration_mode: True
    prescan_mda:
      setup:
        roi: [100, 1050, 1664, 256]
        channel:
          config: Right
          group: Imaging Path
        properties:
          - ['LS Position Galvo', 'Position', '0.116']
          - ['LS Angle Galvo', 'Position', '-0.24']
          - ['Prime BSI Express', 'ReadoutRate', '100MHz 16bit']
          - ['Prime BSI Express', 'Gain', '2-CMS']
          - ['Prime BSI Express', 'ExposeOutMode', 'Rolling Shutter']
          - ['TS2_TTL1-8', 'Sequence', 'Off']
          - ['TS2_TTL1-8', 'Blanking', 'On']
          - ['TS2_DAC03', 'Sequence', 'On']
      stage_positions:
        a1_center_xy: [21080, 24030]
        plate:
          rows: 4
          columns: 6
          name: 24-well
          well_size: [15.6, 15.6]
          well_spacing: [19.0, 19.0]
        selected_wells:
          - [0]
          - [0]
        well_points_plan:
          rows: 3           # 7x7 = 49 FOVs/well; B/3,B/4,B/5 -> 147 total
          columns: 3
          fov_height: 180.0
          fov_width: 180.0

        ### Alternative well plan
        # - x: 21080
        #   y: 24030
        #   plate_row: 0
        #   plate_col: 0

      # grid_plan:
      #   rows: 8
      #   columns: 8
      #   fov_height: 180.0
      #   fov_width: 180.0
      time_plan:
        loops: 1            # single pre-scan timepoint (validated)
        interval: 0
      z_plan:
        top: 79.95
        bottom: -80.1
        step: 0.15
        go_up: true
      channels:
        - config: BF
          group: Channels - Right
          exposure: 5.0

    # Acquired channel fed to reconstruction (must be one of prescan_mda.channels).
    fov_selection_channel: "BF"
    target: cells

    preprocessing: ['flatfield', 'deskew', 'phase', 'best_focus_z', 'segmentation']

    deskew:
      ls_angle_deg: 30.0
      keep_overhang: false
      average_n_slices: 3

    phase:
      transfer_function:
        wavelength_illumination: 0.450
        z_padding: 5
        index_of_refraction_media: 1.4
        numerical_aperture_detection: 1.35
        numerical_aperture_illumination: 0.52
        invert_phase_contrast: false
      apply_inverse:
        reconstruction_algorithm: Tikhonov
        regularization_strength: 0.01

    best_focus_z:
      numerical_aperture_detection: 1.35   # detection (objective) NA
      wavelength_illumination: 0.450       # illumination wavelength, um
      mode: max                            # optional: 'max' (bright objects; default) | 'min'
      midband_fractions: [0.125, 0.25]     # optional: band as a fraction of the cutoff freq
    save_best_focus_z_for_debug: True

    segmentation:
      model: instanseg
      path: C:\Users\labelfree\Documents\instanseg_34532446.zip
      gpu: true

    # FOV-goodness model. See config/mda/fov_selection_demo.yaml (and
    # shrimpy/fov_selection/fov_model.py) for all options + the classification model types.
    #   ranking_by_defined_range: soft desirability score; `top_fov: N` is REQUIRED (keeps the
    #   N highest-scoring FOVs per position). Each feature needs a `shape`
    #   (gaussian|lognormal|sigmoid) + optional `weight`. Feature keys are plain (no channel
    #   prefix); available: coverage_frac, object_counts, average_object_intensity, nn_um_mean, nn_cv, com_offset_norm,
    #   mean_distance_to_center_fov, empty_grid_frac, occupancy_entropy, angular_uniformity,
    #   max_empty_radius, mask_occupancy_entropy, edge_frac, central_cov_ratio.
    model:
      type: ranking_by_defined_range
      top_fov: 3
      aggregation: gaussian
      features:
        coverage_frac:               # fraction of the FOV covered by objects (gaussian bell)
          shape: gaussian
          center: 0.68376            # peak desirability at this coverage
          fwhm: 0.17561              # desirability = 0.5 at center +- 0.0878
          weight: 1.0
        max_empty_radius:                  # largest object-free region radius (um) (gaussian bell)
          shape: gaussian
          center: 21.96101
          fwhm: 7.81154
          weight: 1.0

    # FOV selection decision
    # Debug outputs (off by default):
    save_pre_scan_omezarr: False   # write the pre-scan run to <name>_prescan.ome.zarr
    save_pre_scan_nd: False
    save_decision: True  # per-FOV masks/features/goodness under <name>_fov_debug/
