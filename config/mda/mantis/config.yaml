# Setup
setup:
  roi: [100, 1050, 1664, 256]
  channel:
    config: Right
    group: Imaging Path
  properties:
    - ['LS Position Galvo', 'Position', '0.124']
    - ['LS Angle Galvo', 'Position', '-0.24']
    - ['Prime BSI Express', 'ReadoutRate', '100MHz 16bit']
    - ['Prime BSI Express', 'Gain', '1-HDR']
    - ['Prime BSI Express', 'ExposeOutMode', 'Rolling Shutter']
    - ['TS2_TTL1-8', 'Sequence', 'Off']
    - ['TS2_TTL1-8', 'Blanking', 'On']
    - ['TS2_DAC03', 'Sequence', 'On']

# Define stage positions
stage_positions: []

# Define time plan
time_plan:
  prioritize_duration: true
  interval: 0  # DEBUG
  loops: 1

# Define z plan
z_plan:
  top: 70
  bottom: -90
  step: 0.15
  # step: 15  # DEBUG
  go_up: true

# Define channels
channels:
- config: BF - Oblique
  group: Channels - Right
  exposure: 5.0
  do_stack: true
  z_offset: 0.0
  acquire_every: 1
  camera: null
  # 5 mW 488 laser power
- config: GFP EX488 EM525-45
  group: Channels - Right
  exposure: 10.0
  do_stack: true
  z_offset: 0.0
  acquire_every: 1
  camera: null

autofocus_plan: null
keep_shutter_open_across: []

# Define metadata per microscope
metadata:
  pymmcore_widgets:
    version: 0.10.2.dev23+g22b8c0aff.d20260106
  mantis:
    reset_hardware_sequencing_settings:
      - ['TS2_TTL1-8', 'Blanking', 'Off']
      - ['TS2_DAC03', 'Sequence', 'Off']
      - ['XYStage:XY:31', 'MotorSpeedX-S(mm/s)', '5.75']
      - ['XYStage:XY:31', 'MotorSpeedY-S(mm/s)', '5.75']
    autofocus:
      enabled: true
      method: PFS
      stage: ZDrive

    fov_selection:
      enabled: true
      # Calibration mode: run the PRE-SCAN ONLY (no timelapse), extracting EVERY available
      # feature (the model.features block below is ignored for extraction), then open the
      # feature viewer on the pre-scan's feature matrix. Use it when you don't yet know which
      # features / score function to rank on: explore in the viewer, save a ranking profile
      # to YAML, paste it into model.features, set calibration_mode: False, and re-run for a
      # standard acquisition (pre-scan + timelapse on the selected FOVs). save_decision is
      # forced on in this mode; the feature-matrix CSV + PNG folders land under <name>_fov_debug/.
      calibration_mode: True

      # ---- Pre-scan MDASequence ----
      # A complete, valid MDASequence run FIRST over all candidate FOVs. Its
      # stage_positions (a useq WellPlatePlan: select wells + a per-well FOV grid)
      # are the candidates; useq assigns plate_row/plate_col + slash-free field
      # names, so the output is a proper HCS OME-Zarr (row/col/fov). Here: wells
      # B/3, B/4, B/5 with a 7x7 FOV grid = 147 candidates (the full offline
      # dataset). Offline, the ReplayCamera maps each plate position to the
      # matching source FOV (well B/3 fov k -> k-th source FOV in B/3, row-major).
      # For a quick smoke test, drop well_points_plan to rows/columns 1.
      #
      # Must be a single timepoint (validated); it images only `fov_selection_channel`.
      # The z_plan may differ from the timelapse -- e.g. a single 2D slice.
      prescan_mda:
        setup:
          roi: [100, 1050, 1664, 256]
          channel:
            config: Right
            group: Imaging Path
          properties:
            - ['LS Position Galvo', 'Position', '0.124']
            - ['LS Angle Galvo', 'Position', '-0.24']
            - ['Prime BSI Express', 'ReadoutRate', '100MHz 16bit']
            - ['Prime BSI Express', 'Gain', '1-HDR']
            - ['Prime BSI Express', 'ExposeOutMode', 'Rolling Shutter']
            - ['TS2_TTL1-8', 'Sequence', 'Off']
            - ['TS2_TTL1-8', 'Blanking', 'On']
            - ['TS2_DAC03', 'Sequence', 'On']
        stage_positions:
          # a1_center_xy: [21080, 24030]
          # plate:
          #   rows: 4
          #   columns: 6
          #   name: 24-well
          #   well_size: [15.6, 15.6]
          #   well_spacing: [19.0, 19.0]
          # selected_wells:
          #   - [0]
          #   - [0]
          # well_points_plan:
          #   rows: 3           # 7x7 = 49 FOVs/well; B/3,B/4,B/5 -> 147 total
          #   columns: 3
          #   fov_height: 180.0
          #   fov_width: 180.0
          - x: 21080
            y: 24030
        grid_plan:
          rows: 8
          columns: 8
          fov_height: 180.0
          fov_width: 180.0
        time_plan:
          loops: 1            # single pre-scan timepoint (validated)
          interval: 0
        z_plan:
          top: 79.95
          bottom: -80.1
          step: 0.15
          go_up: true
        channels:
          - config: BF - Oblique
            group: Channels - Right
            exposure: 5.0

      # Acquired channel fed to reconstruction (must be one of prescan_mda.channels).
      fov_selection_channel: "BF - Oblique"

      # Ordered preprocessing steps. Available steps:
      #   reconstruction: flatfield, deskew, phase, vs
      #   projection (pick one): sum_projection, max_projection, middle_slice_projection,
      #       logstd_projection (per-pixel std over Z, log1p-compressed; highlights axial
      #       texture, e.g. for label-free brightfield)
      #   segmentation
      #
      # Three feature-extraction pipelines (projection + segmentation pair). The projection
      # and the segmentation block must be switched TOGETHER -- each pairing below is one
      # choice, not two independent ones.
      #   A) middle-slice deskewed brightfield + Cellpose-DINO  (ACTIVE below): crisp
      #      instance masks; `segmentation.model: cellpose`.
      #   B) log-std deskewed brightfield + Otsu  (ALTERNATIVE below): thresholds a
      #      log-normalized std-over-Z projection into a connected foreground -- no GPU / model,
      #      good for label-free texture. Use `logstd_projection` + `segmentation.model: otsu`.
      #   C) middle-slice deskewed brightfield + InstanSeg (ALTERNATIVE below): a TorchScript
      #      checkpoint giving nucleus / cell instance masks; `segmentation.model: instanseg`.
      #      Pair it with an IMAGE-like projection (middle slice), not the log-std texture map.
      # ---- ACTIVE (pipeline A): middle-slice brightfield + Cellpose-DINO --------------
      preprocessing: ['flatfield', 'deskew', 'middle_slice_projection', 'segmentation']
      # ---- ALTERNATIVE (pipeline B): log-std brightfield + Otsu -----------------------
      # preprocessing: ['flatfield', 'deskew', 'logstd_projection', 'segmentation']
      #   (also switch the `segmentation:` block to the Otsu alternative below)
      # ---- ALTERNATIVE (pipeline C): middle-slice brightfield + InstanSeg -------------
      # preprocessing: ['flatfield', 'deskew', 'middle_slice_projection', 'segmentation']
      #   (also switch the `segmentation:` block to the InstanSeg alternative below)

      deskew:
        ls_angle_deg: 30.0
        keep_overhang: false
        average_n_slices: 3

      # phase:
      #   transfer_function:
      #     wavelength_illumination: 0.450
      #     z_padding: 5
      #     index_of_refraction_media: 1.4
      #     numerical_aperture_detection: 1.35
      #     numerical_aperture_illumination: 0.52
      #     invert_phase_contrast: false
      #   apply_inverse:
      #     reconstruction_algorithm: Tikhonov
      #     regularization_strength: 0.01

      # virtual_staining:
      #   ckpt_path: C://Users//labelfree//Documents//epoch=83-step=14532-loss=0.492.ckpt
      #   target_channels: ['nuclei', 'membrane']
      #   sliding_window_step: 1
      #   model:
      #     class_path: cytoland.engine.VSUNet
      #     init_args:
      #       architecture: fcmae
      #       model_config:
      #         in_channels: 1
      #         out_channels: 2
      #         in_stack_depth: 15
      #         encoder_blocks: [3, 3, 9, 3]
      #         dims: [96, 192, 384, 768]
      #         encoder_drop_path_rate: 0.1
      #         stem_kernel_size: [5, 4, 4]
      #         decoder_conv_blocks: 2
      #         pretraining: false
      #       test_time_augmentations: false
      #       tta_type: mean

      # Switchable segmentation (`model`: cellpose | instanseg | otsu). Cellpose params fall
      # back to the batch script's training defaults when unset. Pick ONE block.
      # ---- ACTIVE (pipeline A): Cellpose-DINO -----------------------------------------
      segmentation:
        model: cellpose
        model_name: cpdino
        gpu: true
        flow_threshold: 0.4
        cellprob_threshold: 0.0
        batch_size: 64
        min_size: 15
        diameters:            # microns; null -> Cellpose auto-scale
          nuclei: null
          membrane: 120.0
      # ---- ALTERNATIVE (pipeline B): Otsu on the log-std projection -------------------
      # Otsu threshold -> optional morphological closing (`close_radius` px disk, bridges gaps
      # between the pieces of a cluster) -> drop connected components below `min_size` px ->
      # fill holes -> connected-component labels. No GPU / trained model. Pair with
      # `logstd_projection`. (px values are full-resolution; tune to your image size.)
      # segmentation:
      #   model: otsu
      #   close_radius: 10     # morphological-closing disk radius in px (0 = skip)
      #   min_size: 8000       # remove foreground components smaller than this (px)
      #   fill_holes: true     # fill interior holes of the foreground
      # ---- ALTERNATIVE (pipeline C): InstanSeg ----------------------------------------
      # An InstanSeg TorchScript checkpoint -- either a bioimage.io .zip export (the model-zoo
      # download: instanseg.pt + rdf.yaml) or a bare .pt. Needs only torch, not the `instanseg`
      # package. Per FOV the projection is percentile-scaled, resampled to the model's TRAINING
      # pixel size, run, then the label map is resampled back to the acquisition pixel grid
      # (nearest, so label ids survive and features stay in acquisition pixel units).
      #
      # Resolution matters: InstanSeg has no `diameter` knob like Cellpose -- matching the
      # pixel size IS how object scale is communicated. A .zip carries this in rdf.yaml and it
      # is read automatically (0.35 um/px for the zoo models); for a bare .pt you must give
      # `model_pixel_size_um` or the FOV is fed at native resolution and objects come out the
      # wrong apparent size.
      #
      # NOTE the zoo checkpoints are trained on histology / fluorescence (H&E, IHC, TissueNet),
      # NOT label-free oblique brightfield -- check the debug PNGs on one FOV before trusting a
      # whole plate. Pair with `middle_slice_projection` (pipeline C), not `logstd_projection`:
      # InstanSeg expects an image, not a texture map.
      # segmentation:
      #   model: instanseg
      #   path: E:\2026_07_28_smart_fov_selection_test\instanseg_34532446.zip
      #   gpu: true
      #   target: cells         # which output head to keep: nuclei | cells

      # FOV-goodness model (pluggable -- see shrimpy/fov_selection/fov_model.py). Pick ONE
      # `model:` block. The model reads features by NAME only, so it is independent of which
      # channel each feature came from; any model pairs with any preprocessing that yields
      # the named features. Three types are available (one active below, two commented out):
      #
      #   ranking_by_defined_range               soft, weighted score (ranking "Model 1"):
      #       score = sum_j weight_j * desirability_j(x_j), desirability in [0, 1].
      #       Per feature: `weight` and `shape` (linear|sigmoid|gaussian|lognormal -- ALWAYS
      #       specify it explicitly). Every shape is set by interpretable "where it's best" +
      #       "how forgiving" numbers (no raw sigma / steepness):
      #         - linear: monotonic ramp -> `onset` (d=0) + `ideal` (d=1); direction implied by
      #           their order (ideal>onset = higher-is-better, else lower). OR target band ->
      #           `range` [lo, hi] (plateau of d=1) + optional `soft` shoulders to 0 (scalar or
      #           [left, right]).
      #         - sigmoid: monotonic -> `midpoint` (d=0.5) + `width` (10%->90% span) +
      #           `direction` (higher|lower). OR soft band -> `half_band` [lo, hi] (d=0.5 edges)
      #           + `width`.
      #         - gaussian (symmetric bell): `center` (peak, d=1) + `fwhm` (d=0.5 at
      #           center +- fwhm/2).
      #         - lognormal (right-skewed bell, x>0): `center` (peak) + `fold` (d=0.5 at
      #           center*fold and center/fold).
      #       A missing feature
      #       (could not be measured, e.g. too few objects) contributes 0 desirability
      #       regardless of direction, so it is penalized and never read as ideal; a FOV with
      #       every feature missing scores 0.
      #       Selection is pure ranking: `top_fov: N` (required) keeps the N FOVs with the
      #       highest weighted-mean desirability across the whole pre-scan -- no threshold,
      #       no good/bad label. The top FOVs "pass" selection (they may be only mediocre;
      #       by design, taking the best N beats keeping nothing). No training / no file.
      #   classification_by_thresholding          hard QC box: keep a FOV iff every feature
      #       is inside its [lo, hi] `range` (AND of all features). No training.
      #   classification_tree                     a trained model saved to a .joblib; give
      #       its `path`. Feature names are whatever it was trained on (e.g. the channel-
      #       prefixed nuclei_vs_sum__coverage_frac when trained on multi-channel features).
      #
      # ---- ACTIVE: ranking by defined range ------------------------------------------
      # 7-feature set (coverage + spacing + spatial-void features). Ranges are starting
      # values seeded from the data quantiles across the bf-midslice datasets; tune them in
      # the feature viewer Rank tab (drag the profile / edit the knobs), then Save… to a YAML
      # file and paste its contents in as the `features:` block below.
      # model:
      #   type: ranking_by_defined_range
      #   top_fov: 20                    # keep (pass) the 20 highest-ranked FOVs; required
      #   features:                      # always specify `shape` explicitly (here: all linear)
      #     coverage_frac:               # fraction of the FOV covered by objects (target band)
      #       shape: linear              # target band: `range` = plateau (d=1), `soft` = shoulders
      #       range: [0.526799, 0.731607]
      #       soft: [0.294287, 0.204808]
      #       weight: 1.0
      #     nn_um_mean:                  # mean nearest-neighbour spacing, um (target band)
      #       shape: linear
      #       range: [22.349744, 31.211642]
      #       soft: [8.861897, 3.29326]
      #       weight: 1.0
      #     nn_cv:                       # spacing variability (std/mean); even = lower is better
      #       shape: linear              # monotonic ramp: d=0 at `onset`, d=1 at `ideal`
      #       onset: 0.346142            # d = 0 (too variable)
      #       ideal: 0.254418            # d = 1 (even spacing); ideal < onset -> lower-is-better
      #       weight: 1.0
      #     empty_grid_frac:             # fraction of empty grid cells; even coverage = lower
      #       shape: linear
      #       onset: 0.84375
      #       ideal: 0.6875
      #       weight: 1.0
      #     occupancy_entropy:           # occupancy spread across the FOV; more spread = higher
      #       shape: linear
      #       onset: 0.549962            # d = 0; ideal > onset -> higher-is-better
      #       ideal: 0.712936            # d = 1
      #       weight: 1.0
      #     max_empty_radius_norm:       # largest empty circle / half-diagonal; smaller = lower
      #       shape: linear
      #       onset: 0.736688
      #       ideal: 0.411649
      #       weight: 1.0
      #     max_gap_um:                  # largest object-free region radius (um); smaller = lower
      #       shape: linear
      #       onset: 70.523688
      #       ideal: 30.587509
      #       weight: 1.0

      # ---- ALTERNATIVE 1: classification by thresholding (hard [lo, hi] box) ----------
      # model:
      #   type: classification_by_thresholding
      #   features:                    # keep a FOV if EVERY feature is in range
      #     coverage_frac: [0.41821, 0.78977]      # bare [lo, hi] list, or
      #     objects_per_10um2:                     # {range: [lo, hi]} form
      #       range: [0.007358, 0.013342]
      #     com_offset_norm: [0.0, 0.404543]

      # ---- ALTERNATIVE 2: classification tree (trained .joblib) ----------------------
      # model:
      #   type: classification_tree
      #   path: /hpc/projects/.../ranking_model_results/models/fov_goodness.joblib
      #   threshold: 0.5               # P(good) cutoff
      #   # Feature names come from the trained model; when trained on multi-channel
      #   # features the online pipeline must emit the same prefixed columns
      #   # (e.g. nuclei_vs_sum__coverage_frac) -> use a matching VS preprocessing.

      # ---- ALTERNATIVE 3: ranking by defined range, NON-LINEAR shapes ----------------
      # Same ranking_by_defined_range model, but with the smooth (non-linear) curves instead
      # of the default flat-top linear band. Each shape is set by interpretable numbers:
      #   gaussian  : `center` (peak, d=1) + `fwhm` (d=0.5 at center +- fwhm/2) -- symmetric bell.
      #   lognormal : `center` (peak) + `fold` (d=0.5 at center*fold and center/fold) -- a
      #               right-skewed bell for positive quantities (too-high is more forgiving).
      #   sigmoid   : `midpoint` (d=0.5) + `width` (10%->90% span) + `direction` -- a soft
      #               threshold ("more/less is better, but gently").
      # (coverage_frac + max_gap_um below are the desirability_ranges_with_Sookie.json profile,
      # its +-1 sigma gaussian ranges expressed as center + fwhm.)
      model:
        type: ranking_by_defined_range
        top_fov: 20                    # keep (pass) the 20 highest-ranked FOVs; required
        features:
          coverage_frac:               # fraction of the FOV covered by objects (gaussian bell)
            shape: gaussian
            center: 0.68376            # peak desirability at this coverage
            fwhm: 0.17561              # desirability = 0.5 at center +- 0.0878
            weight: 1.0
          max_gap_um:                  # largest object-free region radius (um) (gaussian bell)
            shape: gaussian
            center: 21.96101
            fwhm: 7.81154
            weight: 1.0
      #     nn_um_mean:                  # mean nearest-neighbour spacing, um (lognormal bell)
      #       shape: lognormal
      #       center: 26.7              # peak desirability at this spacing
      #       fold: 1.4                 # d = 0.5 at 26.7*1.4 (37.4) and 26.7/1.4 (19.1)
      #       weight: 1.0
      #     occupancy_entropy:           # occupancy spread; more spread = better (sigmoid)
      #       shape: sigmoid
      #       midpoint: 0.63            # d = 0.5 here (the soft acceptance threshold)
      #       width: 0.15               # d rises 10%->90% over this span
      #       direction: higher
      #       weight: 1.0


      # FOV selection decision
      # Debug outputs (off by default):
      save_pre_scan_omezarr: False   # write the pre-scan run to <name>_prescan.ome.zarr
      save_decision: True  # per-FOV masks/features/goodness under <name>_fov_debug/
