# FOV-selection demo (M1): ONE experiment = pre-scan -> select -> timelapse.
#
# Launched with a single command (fov_selection.enabled routes it to the
# FovSelectionAcquisition controller, which runs two internal phases):
#   1. pre-scan  : all positions, single timepoint, the `prescan` params below
#   2. select    : M1 dummy selector keeps every other position
#   3. timelapse : the top-level params below, on the selected positions only
#
# Replays the A549 0-flatfield store (raw BF + GFP), matching the online scenario.
# Names/counts must match the zarr:
#   channels : ['BF - Oblique', 'GFP EX488 EM525-45']
#   shape    : (T=1, C=2, Z=1068, Y=256, X=1664)
#   positions: B/3/000000, B/3/003003, B/4/000000 (subset for a quick M1 test)

# ---- TIMELAPSE parameters (run on the SELECTED positions) ----
stage_positions:
  - name: "B/3/000000"
    x: 0
    y: 0
  - name: "B/3/003003"
    x: 0
    y: 1
  - name: "B/4/000000"
    x: 1
    y: 0

time_plan:
  prioritize_duration: true
  interval: 1
  loops: 1            # set >1 for a real timelapse over time

z_plan:
  top: 79.95
  bottom: -80.1
  step: 0.15
  go_up: true

channels:
  - config: BF - Oblique
    group: Channel
    exposure: 1.0
  - config: GFP EX488 EM525-45
    group: Channel
    exposure: 1.0

# ---- FOV-SELECTION parameters (the pre-scan + decision) ----
metadata:
  mantis:
    fov_selection:
      enabled: true
      # Explicit pre-scan block. Omitted fields default to the timelapse values;
      # timepoints are always forced to 1. Here: brightfield only, full z
      # (z_plan omitted -> same as the timelapse z_plan).
      prescan:
        channels:
          - config: BF - Oblique
            group: Channel
            exposure: 1.0
